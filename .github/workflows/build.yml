name: Build Linux x64 patched Codex

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-hex CSA-codex source commit
        required: true
        type: string
      compat_id:
        description: Exact compatibility ID
        required: true
        type: string
      request_id:
        description: Unique central build request ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    uses: DSLZL/CSA-codex/.github/workflows/build-patched-codex-target.yml@ff4f5bd1914fe0644cc840f435fa4f4d1e1746ac
    with:
      builder_repository: DSLZL/CSA-codex-linux-x64
      cache_mode: read-only
      compat_id: ${{ inputs.compat_id }}
      request_id: ${{ inputs.request_id }}
      retention_days: 7
      runner: ubuntu-24.04
      source_commit: ${{ inputs.source_commit }}
      target: x86_64-unknown-linux-musl
